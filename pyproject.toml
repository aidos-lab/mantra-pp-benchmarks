[project]
name = "mantra-pp-benchmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "mantra-dataset>=0.0.16",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "torch==2.8.0",
    "torch-geometric>=2.7.0",
    "wandb>=0.25.0",
]

[tool.uv.sources]
torch = {index = "pytorch-cu128"}

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-sparse = ["torch"]
pyg-lib = ["torch"]



[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
