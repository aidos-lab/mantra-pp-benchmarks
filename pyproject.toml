[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "mantra-pp-benchmarks"
version = "0.0.1"
description = "Extended Manifold Triangulations"
readme = "README.md"
repository = "https://github.com/aidos-lab/mantra-pp-benchmarks.git"
package-mode = false

[tool.poetry.dependencies]
python = "~3.10"
gudhi = "3.9.0"
lightning = "2.2.5"
wandb = "0.17.0"
scikit-learn = "1.5.0"
scipy = "1.10.1"
torch_geometric = "2.5.3"
pandas = "2.2.2"
pydantic = "2.7.2"
torchvision = "0.18.0"
gensim = "4.3.2"
omegaconf = "2.3.0"
pydantic-settings = "2.2.1"
tabulate = "0.9.0"
ogb = "1.3.6"
mantra-dataset = "0.0.6"
jaxtyping = "0.2.34"

[tool.poetry.dev-dependencies]
black = {version = "^21.12b0", allow-prereleases = true}

[tool.black]
line-length = 79
