[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "mantra-pp-benchmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.2",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.12.0",
    "torchmetrics>=1.8.2",
    "wandb>=0.25.0",
]


[project.optional-dependencies]
cpu = [
    "mantra-dataset",
    "torch==2.9.0+cpu; sys_platform == 'linux'",
    "torch==2.9.0; sys_platform == 'darwin'",
    "torch-geometric",
    "pyg-lib==0.6.0+pt29cpu; sys_platform == 'linux'",
    "pyg-lib==0.6.0+pt29; sys_platform == 'darwin'",
    "torch-sparse==0.6.18+pt29cpu; sys_platform == 'linux'",
    "torch-sparse==0.6.18; sys_platform == 'darwin'",
    "torch-scatter==2.1.2+pt29cpu; sys_platform == 'linux'",
    "torch-scatter==2.1.2; sys_platform == 'darwin'",
]
cu130 = [
    "mantra-dataset; sys_platform == 'linux'",
    "torch==2.9.0+cu130; sys_platform == 'linux'",
    "torch-geometric; sys_platform == 'linux'",
    "pyg-lib==0.6.0+pt29cu130; sys_platform == 'linux'",
    "torch-sparse==0.6.18+pt29cu130; sys_platform == 'linux'",
    "torch-scatter==2.1.2+pt29cu130; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv]
environments = ["platform_system == 'Linux' or platform_system == 'Darwin'"]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[[tool.uv.index]]
name = "pytorch-all"
url = "https://download.pytorch.org/whl/"
explicit = true

[[tool.uv.index]]
name = "pyg-cuda" 
url = "https://data.pyg.org/whl/torch-2.9.0+cu130.html"
explicit = true
format = "flat"

[[tool.uv.index]]
name = "pyg-cpu" 
url = "https://data.pyg.org/whl/torch-2.9.0+cpu.html"
explicit = true
format = "flat"

[tool.uv.sources]
mantra-dataset = { path = "../mantra" , editable=true}
torch = [
    { index = "pytorch-all"},
]
pyg-lib = [
    { index = "pyg-cpu", extra = "cpu", marker = "platform_system == 'Linux'"},
    { index = "pyg-cpu", extra = "cpu", marker = "platform_system == 'Darwin'"},
    { index = "pyg-cuda", extra = "cu130", marker = "platform_system == 'Linux'"},
]
torch-sparse = [
    { index = "pyg-cpu", extra = "cpu", marker = "platform_system == 'Linux'"},
    { index = "pyg-cpu", extra = "cpu", marker = "platform_system == 'Darwin'"},
    { index = "pyg-cuda", extra = "cu130", marker = "platform_system == 'Linux'"},
]
torch-scatter = [
    { index = "pyg-cpu", extra = "cpu", marker = "platform_system == 'Linux'"},
    { index = "pyg-cpu", extra = "cpu", marker = "platform_system == 'Darwin'"},
    { index = "pyg-cuda", extra = "cu130", marker = "platform_system == 'Linux'"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
