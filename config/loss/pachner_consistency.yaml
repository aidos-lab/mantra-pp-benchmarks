# Task loss plus a penalty on the distance between two snapshots of the
# same Pachner walk (step walks, dataset.walk_length > 0, or size walks,
# dataset.size_targets, where the pairs are a source and its larger
# copies). Needs trainer.sampler=walks.
_target_: src.metrics.loss.PachnerConsistency

weight: 1.0
# "embedding" penalises ||g(T_a) - g(T_b)||^2, "relative" the scale-free
# ||g_a - g_b||^2 / (||g_a||^2 + ||g_b||^2), "logits" the symmetric KL.
target: embedding
eps: 1.0e-8
