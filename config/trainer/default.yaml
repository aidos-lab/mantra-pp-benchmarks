learning_rate: 0.01
weight_decay: 0.0
max_epoch: 2
batch_size: 256
early_stopping: 10
device: cpu
num_workers: 0
pin_memory: True
# "random", or "walks" to batch whole Pachner walks so that the
# consistency objective sees same-walk pairs (needs dataset.walk_length > 0).
sampler: random
eval_embeddings: True
# Apply the dataset transforms once at start-up instead of on every
# access (they are deterministic and dominate the epoch time). Leave off
# for transforms that should be resampled each epoch (random features).
materialize: False
