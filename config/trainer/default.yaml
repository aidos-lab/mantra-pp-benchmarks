learning_rate: 0.01
weight_decay: 0.0
max_epoch: 2
batch_size: 256
early_stopping: 10
device: cpu
num_workers: 0
pin_memory: True
# "random", or "walks" to batch whole Pachner walks so that the
# consistency objective sees same-walk pairs (needs dataset.walk_length > 0).
sampler: random
eval_embeddings: True
# Apply the dataset transforms once at start-up instead of on every
# access (they are deterministic). Implies num_workers=0: forked workers
# would each copy the materialized entries. Leave off for transforms
# that should be resampled each epoch (random features).
materialize: False
# Randomise the positional node IDs (moment-curve features) per training
# batch: permute them among the nodes/vertices of each complex and
# recompute the barycentric higher-rank features. id_columns = number of
# leading feature columns that are IDs (null: all; 2 on the Levi graph,
# where the one-hot node type follows the 2-dim moment curve).
permute_ids: False
id_columns: null
