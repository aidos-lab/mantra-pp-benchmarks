defaults:
  - base_task

name: Chern
task_type: regression

# Graph-level regression of the `c2_anticanonical` scalar column.
# NOTE on the sign: the column stores the origin entry of the c2
# vector, which CYTools assigns to the canonical divisor K, so the
# label is c2 . K = -(c2 . (-K)) ~ -98 -- flipped relative to the
# literature value of the anticanonical integral. Requires `loss=mse`.
targets: [c2_anticanonical]
sum_targets: False

# The label scale (~ -98 +- 10) is far from the models' output at
# init; standardization lets the optimizer reach it without pushing
# everything through the output bias.
standardize_targets: True

# Unused for regression; kept for compatibility with transforms that
# interpolate ${task.target}.
target: c2_anticanonical

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
  # c2_anticanonical is even on every sample; score against the even
  # lattice as well so odd roundings are not counted as misses.
  lattice_accuracy:
    _target_: src.metrics.regression.LatticeRoundedAccuracy
    spacing: 2
