defaults:
  - base_task

name: Chern
task_type: regression

# Graph-level regression of the `c2_anticanonical` scalar column:
# the second Chern class integrated against the anticanonical
# divisor (e.g. 50 for the quintic).
target: c2_anticanonical

# The label scale is far from the models' output at init;
# standardization lets the optimizer reach it without pushing
# everything through the output bias.
standardize_targets: True

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
  # c2_anticanonical is even on every sample; also score against the
  # even lattice so odd roundings are not counted as misses.
  lattice_accuracy:
    _target_: src.metrics.regression.LatticeRoundedAccuracy
    spacing: 2
