defaults:
  - base_task

loss:
  _target_: torch.nn.MSELoss

name: Chern
task_type: regression

# Graph-level regression of the `c2_anticanonical` scalar column: the
# second Chern class integrated against the anticanonical divisor
# (e.g. 50 for the quintic).
target: c2_anticanonical

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
