defaults:
  - base_task

loss:
  _target_: torch.nn.CrossEntropyLoss

name: HodgeClass
task_type: classification

# Classify the attribute value; every value of the full dataset gets
# its own class (see create_dataset).
target: h11

metrics:
  accuracy:
    _target_: torchmetrics.Accuracy
  balanced_accuracy:
    _target_: torchmetrics.Accuracy
    average: macro
