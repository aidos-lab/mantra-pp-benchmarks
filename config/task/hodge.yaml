defaults:
  - base_task
  - /loss: mse
  - /transform@_global_.dataset.transform.create_labels: attribute_regression_labels

name: Hodge
task_type: regression

# Hodge-number regression; override with e.g. task.target=h12.
target: h11

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
