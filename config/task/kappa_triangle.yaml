defaults:
  - base_task

loss:
  _target_: torch.nn.MSELoss

name: KappaTriangle
task_type: regression
task_level: triangle

# Written per triangle by the cy dataset's `kappa` transform.
target: kappa_2

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
