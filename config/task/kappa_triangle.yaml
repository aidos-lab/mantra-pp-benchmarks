defaults:
  - base_task

loss:
  _target_: torch.nn.MSELoss

name: KappaTriangle
task_type: regression
task_level: triangle

# Intersection number of the three divisors of every triangle of the
# triangulation, written by the `kappa` transform of the cy dataset;
# triangles through the origin (the canonical class) are targets too.
target: kappa_2

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
