defaults:
  - base_task

name: ChernNode
task_type: regression

# Node-level regression: one target per triangulation vertex, the
# second Chern class paired with the vertex's prime toric divisor
# (c2 . D_i). Use with
#   transform@dataset.transform.create_labels=create_node_regression_labels
#   model.task_level=node
# and `loss=mse`. The origin vertex carries no divisor and is masked
# out via `node_mask` (see src/transforms.py).
targets: [c2]
sum_targets: False

# Standardized like task=chern, mostly for consistency: the per-vertex
# targets are small (~ 2.2 +- 3.1) but the loss scale then matches the
# graph-level task and val/loss curves stay comparable.
standardize_targets: True

# Unused for regression; kept for compatibility with transforms that
# interpolate ${task.target}.
target: c2

metrics:
  mae:
    _target_: torchmetrics.MeanAbsoluteError
  rounded_accuracy:
    _target_: src.metrics.regression.RoundedAccuracy
  # c2 . D_i is even on every sample; score against the even lattice as
  # well so odd roundings are not counted as misses.
  lattice_accuracy:
    _target_: src.metrics.regression.LatticeRoundedAccuracy
    spacing: 2
