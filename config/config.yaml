# @package _global_
defaults:
  - _self_
  - logger: wandb
  - model: gcn 
  - dataset: dataset
  - representation@dataset.transform.representation: dual_graph
  - transform@dataset.transform.embedding: random_walk_pe
  # The label transform is task-specific; every task config selects its
  # own via `/transform@_global_.dataset.transform.create_labels`.
  - transform@dataset.transform.select_features: select_features
  # The loss composes before the task so a task can override it in its
  # own defaults list (e.g. regression tasks select mse).
  - loss: cross_entropy
  - task: name
  - trainer: default

train: True
seed: 42
compile: True
checkpoint_path: checkpoints
