# @package _global_
defaults:
  - _self_
  - logger: wandb
  - model: gcn 
  - dataset: dataset
  - representation@dataset.transform.representation: dual_graph
  - transform@dataset.transform.embedding: random_walk_pe
  - transform@dataset.transform.select_features: select_features
  - task: name
  - trainer: default
  - ood: none

train: True
# Run seed: model initialisation and feature sampling. The
# train/val/test split has its own seed (dataset.seed).
seed: 42
torch_seed: ${seed}
compile: True
checkpoint_path: checkpoints
save_checkpoints: False
