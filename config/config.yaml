# @package _global_
defaults:
  - _self_
  - logger: wandb
  - model: gcn 
  - dataset: dataset
  - representation@dataset.transform.representation: dual_graph
  - transform@dataset.transform.embedding: random_walk_pe
  - transform@dataset.transform.select_features: select_features
  - task: name
  - trainer: default
  - loss: cross_entropy
  - ood: none

train: True
# Run seed: model initialisation, feature sampling and the pair sampler.
# The train/val/test split has its own seed (dataset.seed).
seed: 42
torch_seed: ${seed}
compile: True
checkpoint_path: checkpoints
# Evaluate the best-validation weights of an earlier run instead of
# training (with train=False): the directory training_loop wrote for
# that run, e.g. checkpoints/<project>/<run name>. See main.load_checkpoint.
checkpoint: null
save_checkpoints: False
