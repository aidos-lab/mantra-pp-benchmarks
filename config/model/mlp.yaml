_target_: src.models.MLP.MLP

n_layers: 3
hidden_channels: 64
out_channels: 1 # Get from task
dropout: 0.2
batch_norm: True
residuals: True

readout: mean  # sum keeps the readout extensive (CY targets scale with complex size)

# ReLU on the output head (the historical classification behavior).
# main.py forces this to False for regression tasks: a clamped head
# cannot emit below-mean predictions.
readout_activation: True
