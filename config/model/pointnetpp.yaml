_target_: src.models.PointNetPP.PointNetPP

hidden_channels: 64
out_channels: 1 # Get from task
dropout: 0.0

# FPS sampling ratio and grouping radius per set-abstraction level;
# defaults sized for the small 4-d lattice point sets.
sa_ratios: [0.5, 0.5]
sa_radii: [2.0, 4.0]

# symmetric aggregation of the global stage
pool_method: sum
