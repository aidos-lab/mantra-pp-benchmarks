_target_: src.models.PointNet.PointNet

hidden_channels: 96
n_layers: 3
out_channels: 1 # Get from task
batch_norm: True
dropout: 0.0

task_level: graph  # 'node' emits one output per point
readout: sum       # symmetric aggregation over the point set
global_feature: True  # node-level head also sees the pooled global feature
