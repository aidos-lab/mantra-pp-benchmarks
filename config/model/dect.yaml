_target_: src.models.dect.DECT

num_directions: 64
resolution: 64
# Thresholds span [-radius, radius]; 8 as for the precomputed ECT
# (config/transform/ect.yaml).
radius: 8.0
# Slope of the sigmoid in units of the radius.
scale: 64.0
# Highest rank of the simplices in the transform: 0 the point set, 1 the
# one-skeleton, 4 the full triangulation. The dect chain caches all ranks.
max_rank: 4

hidden_channels: 144
n_layers: 3
dropout: 0.0
out_channels: 1 # Get from task
task_level: graph # Get from task
head_layers: 0
