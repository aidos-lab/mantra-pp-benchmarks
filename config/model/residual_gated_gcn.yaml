_target_: src.models.ResidualGatedGCN.ResidualGatedGCN

hidden_channels: 128
n_layers: 5
out_channels: 1 # Set at runtime
batch_norm: true
residuals: true
dropout: 0.5
# Readout shared by all models: pool the node/simplex features over the
# complex (sum, mean or max), then one linear head.
pool_method: sum
