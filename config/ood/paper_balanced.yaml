# @package dataset.ood_evaluations
# The subdivision columns of the balanced generalization tables
# (Tables S.11 and S.12): 0.75-top and full stellar subdivision and
# one barycentric round. Balanced classes reach far beyond 16
# vertices, so there is no graded column.
stellar075:
  division_type: stellar
  subdivision: {fraction: 0.75}
stellar1:
  division_type: stellar
  subdivision: {fraction: 1.0}
bary1:
  division_type: barycentric
  subdivision: {round: 1}
