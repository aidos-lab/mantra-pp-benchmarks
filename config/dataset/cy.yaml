defaults:
  - dataset
  - /transform@transform.kappa: triangle_intersection_numbers
  - /transform@transform.select_attributes: select_attributes

# Calabi-Yau star triangulations from a parquet file. Requires the
# mantra `cy` branch: `CalabiYau` is not part of mantra main.
type: cy
root: "./data/cy"
local_path: null

# Only process the first `limit` samples; limited variants get their
# own processed directory, so they are cheap for smoke tests.
limit: null

# Splits stratify on / filter by the values of `label_source`.
# Stratifying needs every kept value in each split, so switch it on
# together with a `min_sample_per_class` that drops the rare values.
use_stratified: False
label_source: h11
min_sample_per_class: null

# Samples with the same value of this attribute share a split: set it to
# polytope_id for a parquet with several phases per polytope
# (scripts/cy/make_phases_parquet.py).
group_by: null

# null uses every CPU the job may run on.
pre_transform_workers: null

# select_attributes comes last, so the cache holds only its keep_keys.
transform_order:
  - representation
  - embedding
  - select_features
  - kappa
  - select_attributes

# 20% test split as in arXiv:2112.09117.
train_parameters:
  split:
    train: 0.7
    val: 0.1
    test: 0.2
