root: "./data"
version: latest
dimension: 2
local_path: null
balanced: False
train_parameters:
  split:
    train: 0.6
    val: 0.2
    test: 0.2

transform: {}
transform_order:
  - representation
  - embedding
  - select_features

seed: 40
reload: False
use_stratified: True
max_vertices: null
n_moves: 5
min_sample_per_class: 100
target_count: 100
use_surgery: True
max_ood_size_per_class: 100
division_type: "none"
# Pachner walks (PachnerWalkDataset); 0 keeps the plain MantraDataset.
walk_length: 0
moves_per_step: 1
# Relative weights of the (flip, subdivide, coarsen) moves along a walk;
# null = equal. [1, 1, 0] gives refining walks that never lose vertices.
move_weights: null
# Size-targeted walks, the other expansion (mutually exclusive with
# walk_length > 0): every entry of the splits in size_splits is followed
# by one refining walk per target vertex count, stopped exactly there
# (as a `pachner` OOD cell with `target` is), so every class appears at
# every size with the same multiplicity. keep_base=False drops the
# sources, size_mix adds 2-2 flips per vertex after the target is
# reached. Entries carry walk_base/walk_step, so trainer.sampler=walks
# and loss=pachner_consistency pair a source with its larger copies.
size_targets: null
size_splits: [train, val]
keep_base: True
size_mix: 0.0
# Keyword arguments of the OOD subdivision, e.g. {graded_vertex_number: 16},
# {fraction: 0.75} or {round: 1}.
subdivision: {}
# Several subdivisions evaluated in one run; set by the `ood` config
# group. Overrides division_type/subdivision when non-empty.
ood_evaluations: {}
