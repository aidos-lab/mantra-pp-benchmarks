# 'mantra' (JSON manifold triangulations) or 'cy' (parquet
# Calabi-Yau star triangulations, see dataset/cy.yaml).
type: "mantra"
root: "./data"
version: latest
dimension: 2
local_path: null
balanced: False
train_parameters:
  split:
    train: 0.6
    val: 0.2
    test: 0.2

transform: {}
# Execution order of the entries in `transform`. Lives in the dataset
# group (not the primary config body) so it survives composition:
# `_self_` comes first in config.yaml, so group configs override the
# body. The representation must run before the embedding, which needs
# `edge_index`.
transform_order:
  - representation
  - embedding
  - create_labels
  - select_features

reload: False
use_stratified: True
max_vertices: null
n_moves: 5
min_sample_per_class: 100
target_count: 100
use_surgery: True
max_ood_size_per_class: 100
division_type: "none"
