root: "./data"
version: latest
dimension: 2
local_path: null
balanced: False
train_parameters:
  split:
    train: 0.6
    val: 0.2
    test: 0.2

transform: {}
transform_order:
  - representation
  - embedding
  - select_features

seed: 40
reload: False
use_stratified: True
max_vertices: null
n_moves: 5
min_sample_per_class: 100
target_count: 100
use_surgery: True
max_ood_size_per_class: 100
division_type: "none"
# Pachner walks (PachnerWalkDataset); 0 keeps the plain MantraDataset.
walk_length: 0
moves_per_step: 1
walk_seed: null
# Keyword arguments of the OOD subdivision, e.g. {graded_vertex_number: 16},
# {fraction: 0.75} or {round: 1}.
subdivision: {}
