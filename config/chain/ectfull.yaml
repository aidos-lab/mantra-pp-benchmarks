# @package _global_
# Euler characteristic curves of the full complex (its support function). For ect_vit only.
defaults:
  - /transform@dataset.transform.ect: ect
  - override /representation@dataset.transform.representation: null
  - override /transform@dataset.transform.embedding: null
  - override /transform@dataset.transform.select_attributes: select_attributes_ect

dataset:
  transform:
    ect:
      max_rank: null
      per_rank: false
    select_features:
      src: coords
  transform_order: [ect, select_features, select_attributes]

model:
  num_ranks: 1
